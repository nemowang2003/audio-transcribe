[project]
name = "audio-transcribe"
version = "0.2.2"
description = "Transcribe audio files with faster-whisper"
requires-python = ">=3.10"
dependencies = [
    "av>=11,<18",
    "faster-whisper>=1.2.1,<2",
    "huggingface-hub>=0.34,<2",
]

[project.scripts]
audio-transcribe = "audio_transcribe:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]
