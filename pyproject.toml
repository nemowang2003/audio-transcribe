[project]
name = "audio-transcribe"
version = "0.2.0"
description = "Transcribe audio files with faster-whisper"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.2.1,<2",
    # faster-whisper 1.2.1 passes metadata_errors, removed in PyAV 19.
    "av>=11,<19",
    "filelock>=3,<5",
    "huggingface-hub>=0.34,<2",
]

[project.scripts]
audio-transcribe = "audio_transcribe:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

# Lock the build backend as well as runtime dependencies for uv2nix.
[dependency-groups]
build = ["uv_build>=0.11.28,<0.12"]
